version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeilenschreiben
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/02-create-roles.sh
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:latest
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@postgres:5432/zeilenschreiben
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon_user
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${VITE_POSTGREST_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        VITE_POSTGREST_URL: ${VITE_POSTGREST_URL}
    depends_on:
      - postgrest
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      - app
      - postgrest
    restart: unless-stopped

volumes:
  postgres_data:
